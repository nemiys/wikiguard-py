services:
  postgres:
    image: postgres:16
    container_name: wikiguard-py-postgres
    environment:
      POSTGRES_DB: wikiguard
      POSTGRES_USER: wikiguard
      POSTGRES_PASSWORD: wikiguard
    ports:
      - "5433:5432" # 5432 tied up by wiki-guard (Java) — see docs/adr for the port choice
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: wikiguard-py-redis
    ports:
      - "6380:6379" # 6379 tied up by wiki-guard (Java)

  kafka:
    image: apache/kafka:4.2.0
    container_name: wikiguard-py-kafka
    ports:
      - "9094:9092" # 9092 tied up by wiki-guard (Java)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Same reasoning as wiki-guard (Java): auto-create defaults to 1 partition,
      # which would silently win any race against our own topic-provisioning code
      # (3 partitions, see ADR-0002) if a producer/consumer touches the topic first.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

volumes:
  postgres-data:
